---
- hosts: all
  become: yes
  tasks:
    - name: Installer docker python et pip
      apt:
        name:
          - docker.io
          - python3
          - python3-pip
        state: present
        update_cache: yes
      when: ansible_os_family == 'Debian'

    - name: S'assurer que Docker est démarré et activé au démarrage
      service:
        name: docker
        state: started
        enabled: yes

    - name: Installer docker-compose depuis GitHub binary
      shell: |
        curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)" -o /usr/local/bin/docker-compose
        chmod +x /usr/local/bin/docker-compose
      args:
        creates: /usr/local/bin/docker-compose